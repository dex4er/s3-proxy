name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - .editorconfig
      - .gitignore
      - .markdownlint.yaml
      - .claude/**
      - .trunk/**
      - AGENTS.md
      - CLAUDE.md
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-26.04-arm

    # S3Mock serves the S3 API for TestS3Mock in s3mock_test.go. It supports
    # path-style addressing only, which the test client uses.
    services:
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: test-bucket
        ports:
          - 9090:9090

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Git tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser comes from mise so that its version has a single source
      # (mise.toml) and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.13 # datasource=github-releases depName=jdx/mise
          install_args: goreleaser

      - name: Run GoReleaser
        run: goreleaser build --clean --snapshot --single-target --output s3-proxy

      - name: Test the output
        run: |
          ./s3-proxy --version 2>&1 | grep "s3-proxy version"

      # The service container is started before the steps but not waited
      # for, and S3Mock takes a few seconds to come up.
      - name: Wait for S3Mock
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:9090/favicon.ico && exit 0
            sleep 1
          done
          echo "::error::S3Mock did not start"
          exit 1

      - name: Run Go tests
        run: go test -v ./...
        env:
          S3PROXY_TEST_ENDPOINT: http://localhost:9090
