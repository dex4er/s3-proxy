name: Test

on:
  push:
    branches-ignore:
      - automated/*
      - renovate/*
    paths-ignore:
      - .editorconfig
      - .gitignore
      - .markdownlint.yaml
      - .claude/**
      - .trunk/**
      - AGENTS.md
      - CLAUDE.md
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test

    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Git tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser comes from mise so that its version has a single source
      # (mise.toml) and the download is verified against mise.lock.
      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.8 # datasource=github-releases depName=jdx/mise
          install_args: goreleaser

      - name: Run GoReleaser
        run: goreleaser build --clean --snapshot --single-target --output s3-proxy

      - name: Test the output
        run: |-
          ./s3-proxy --version 2>&1 | grep "s3-proxy version"
